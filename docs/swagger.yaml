definitions:
  cmd_api.AuthenticationPayload:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  cmd_api.CommentPayload:
    properties:
      content:
        maxLength: 100
        type: string
    required:
    - content
    type: object
  cmd_api.FollowUser:
    properties:
      user_id:
        type: integer
    type: object
  cmd_api.PostPayload:
    properties:
      content:
        maxLength: 1000
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 100
        type: string
    required:
    - content
    - title
    type: object
  cmd_api.PostWithMetadata:
    properties:
      count:
        type: integer
      limit:
        type: integer
      offset:
        type: integer
      order:
        type: string
      posts:
        items:
          $ref: '#/definitions/model.PostWithMetadata'
        type: array
      search:
        type: string
      since:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  cmd_api.UpdatePayload:
    properties:
      content:
        maxLength: 1000
        type: string
      title:
        maxLength: 100
        type: string
    type: object
  model.Comment:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      post_id:
        type: integer
      user_id:
        type: integer
    type: object
  model.PostWithMetadata:
    properties:
      comment_count:
        type: integer
      comments:
        items:
          $ref: '#/definitions/model.Comment'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      version:
        type: integer
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a simple social media API built with Go.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Social Media API
paths:
  /authentication/user:
    post:
      consumes:
      - application/json
      description: Registers a new user with the provided email and password
      parameters:
      - description: User registration payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/cmd_api.AuthenticationPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema: {}
      summary: Register a new user
      tags:
      - auth
  /v1/health:
    get:
      consumes:
      - application/json
      description: Check the health status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Health check
      tags:
      - Health
  /v1/posts:
    post:
      consumes:
      - application/json
      description: Create a new post with title, content, and tags
      parameters:
      - description: Post data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cmd_api.PostPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_api.PostPayload'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Create a new post
      tags:
      - Posts
  /v1/posts/{postId}:
    get:
      consumes:
      - application/json
      description: Get post details by post ID
      parameters:
      - description: Post ID
        in: path
        name: postId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PostWithMetadata'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get post by ID
      tags:
      - Posts
    patch:
      consumes:
      - application/json
      description: Update a post by its ID with new title and/or content
      parameters:
      - description: Post ID
        in: path
        name: postId
        required: true
        type: integer
      - description: Post data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cmd_api.UpdatePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.UpdatePayload'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Update an existing post
      tags:
      - Posts
  /v1/posts/{postId}/comments:
    post:
      consumes:
      - application/json
      description: Create a new comment on a post by post ID
      parameters:
      - description: Post ID
        in: path
        name: postId
        required: true
        type: integer
      - description: Comment data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cmd_api.CommentPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_api.CommentPayload'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Create a new comment
      tags:
      - Comments
  /v1/user/{userId}:
    get:
      consumes:
      - application/json
      description: Get user details by user ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get user by ID
      tags:
      - Users
  /v1/user/{userId}/follow:
    put:
      consumes:
      - application/json
      description: Follow a user by their ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      - description: User to follow
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cmd_api.FollowUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Follow a user
      tags:
      - Users
  /v1/user/{userId}/unfollow:
    put:
      consumes:
      - application/json
      description: Unfollow a user by their ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      - description: User to unfollow
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cmd_api.FollowUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Unfollow a user
      tags:
      - Users
  /v1/user/feed:
    get:
      consumes:
      - application/json
      description: Get the feed of posts for a user
      parameters:
      - in: query
        maximum: 20
        minimum: 0
        name: limit
        type: integer
      - in: query
        minimum: 0
        name: offset
        type: integer
      - enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - in: query
        maxLength: 100
        name: search
        type: string
      - in: query
        name: since
        type: string
      - collectionFormat: csv
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.PostWithMetadata'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get user feed
      tags:
      - Users
schemes:
- http
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
